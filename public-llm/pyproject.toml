[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quiettv-mcp"
version = "0.1.0"
description = "Local stdio MCP server for one owner-configured Quiet TV: status, Home, remote keys, app launch, diagnostics, fresh screen capture and optional Wake-on-LAN."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }  # see docs/LICENSING.md and the root LICENSE
dependencies = [
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
quiettv-mcp = "quiettv_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
